name: landrop
description: Xender-style local file & APK sharing. Receiver only needs a browser.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  qr_flutter: ^4.1.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  network_info_plus: ^5.0.3
  file_picker: ^6.1.1
  path: ^1.9.0
  mime: ^1.0.5
  uuid: ^4.3.3
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
