name: landrop
description: Xender-style local file & APK sharing. Receiver only needs a browser.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  shelf_router: ^1.1.4
  network_info_plus: ^6.0.1
  file_picker: ^8.1.2
  open_filex: ^4.5.0
  shared_preferences: ^2.3.2
  path: ^1.9.0
  mime: ^1.0.6
  uuid: ^4.5.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
